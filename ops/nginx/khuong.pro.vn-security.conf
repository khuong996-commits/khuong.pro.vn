# Included only by the primary khuong.pro.vn server block. Keeping this as a
# snippet avoids replacing the unrelated Agent and router virtual hosts. The
# port-80 `server_name _` fallback must return 404 instead of serving this root.

# `unsafe-inline` remains temporarily because the legacy static applications
# use inline event handlers. Untrusted data is escaped in application code;
# this policy still constrains every other execution and data-loading origin.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.tailwindcss.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://unpkg.com https://cdn.tailwindcss.com https://aistudiocdn.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com https://docs.google.com https://maps.google.com; upgrade-insecure-requests" always;

# Certbot's existing `^~ /.well-known/acme-challenge/` location stays above
# this deny rule. Every other hidden path is denied before `try_files` can
# fall back to the public app shell.
location ~ /\. {
    return 404;
}

# A future accidental working-tree deploy must not expose credentials, rules,
# database files, backups, or private keys.
location ~* \.(?:env|ini|log|bak|old|orig|swp|sql|sqlite|db|pem|key|p12|pfx|rules)$ {
    return 404;
}

# Recruitment is paused. Keeping this explicit response prevents stale clients
# from reaching the receiver while the prior Telegram credential is retired.
location = /api/recruitment {
    return 410;
}

# The former browser-side Telegram credential must not remain in a stale
# cache. The HTML also uses a versioned URL to force a fresh fetch.
location = /tuyendung/js/main.js {
    expires -1;
}
